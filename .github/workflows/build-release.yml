name: NS Browser Android Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CHROMIUM_VERSION: "152.0.7977.42"
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
      - name: Fetch Chromium
        run: |
          mkdir chromium
          cd chromium
          fetch --nohooks android
      - name: Verify and checkout requested version
        run: |
          cd chromium/src
          if git rev-parse --verify "refs/tags/$CHROMIUM_VERSION" >/dev/null 2>&1; then
            git checkout "refs/tags/$CHROMIUM_VERSION"
          else
            echo "::error::Chromium tag $CHROMIUM_VERSION was not found. Build stopped; no other version is substituted."
            exit 1
          fi
      - name: Sync dependencies
        run: cd chromium/src && gclient sync -D --force --reset
      - name: Generate GN configuration
        run: |
          cd chromium/src
          gn gen out/NSBrowser --args='
            target_os="android"
            target_cpu="arm64"
            is_official_build=true
            is_component_build=false
            is_debug=false
            symbol_level=0
            blink_symbol_level=0
            enable_nacl=false
            chrome_public=true
          '
      - name: Build APK
        run: cd chromium/src && autoninja -C out/NSBrowser chrome_public_apk
      - name: Collect APK
        run: |
          mkdir -p release
          apk=$(find chromium/src/out/NSBrowser -type f -name "*.apk" | head -n1)
          test -n "$apk"
          cp "$apk" release/NS-Browser-arm64-v8a.apk
      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: NS-Browser-arm64-v8a
          path: release/NS-Browser-arm64-v8a.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/NS-Browser-arm64-v8a.apk
          generate_release_notes: true
          
